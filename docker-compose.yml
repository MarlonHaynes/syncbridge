services:
  postgres:
    image: postgres:16-alpine
    container_name: syncbridge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: syncbridge
    ports:
      # Host port 5433 (not 5432) to avoid clashing with a Postgres install
      # already running on the host. Container-internal port stays 5432.
      - "5433:5432"
    volumes:
      - syncbridge_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: syncbridge-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  syncbridge_pgdata:
